name: Hotel Outreach Bot

# Runs automatically every hour, 24/7 — no local PC required.
on:
  schedule:
    - cron: '0 * * * *'   # every hour at minute 0
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check Gmail without sending, preview, or send a live batch'
        type: choice
        default: check-api
        options:
          - check-api
          - check-smtp
          - dry-run
          - send

concurrency:
  group: hotel-outreach-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Gmail API authorization without sending
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-api'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: python bot.py --check-api

      - name: Check Gmail without sending
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-smtp'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bot.py --check-smtp

      - name: Preview queue without sending
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python bot.py --dry-run

      - name: Import verified recruiting contacts
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'send')
        run: python hotel_hunter_feeder.py

      - name: Send batch of emails
        id: send
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'send')
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HOTEL_CV_PDF_BASE64: ${{ secrets.HOTEL_CV_PDF_BASE64 }}
          HOTEL_MAIL_TRANSPORT: gmail-api
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: python bot.py

      - name: Commit updated lead data & logs
        if: ${{ !cancelled() && (steps.send.outcome == 'success' || steps.send.outcome == 'failure') }}
        run: |
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "Hotel Bot"
          git add data/ logs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Bot run: update leads & logs [skip ci]"
          git push
